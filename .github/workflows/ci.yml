name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17

        env:
          POSTGRES_USER: clearmytravel
          POSTGRES_PASSWORD: clearmytravel
          POSTGRES_DB: clearmytravel

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U clearmytravel -d clearmytravel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://clearmytravel:clearmytravel@localhost:5432/clearmytravel?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.28.0

      - name: Run migrations
        run: |
          goose \
            -dir migrations \
            postgres "$DATABASE_URL" \
            up

      - name: Seed development data
        run: |
          PGPASSWORD=clearmytravel \
            psql \
            -h localhost \
            -p 5432 \
            -U clearmytravel \
            -d clearmytravel \
            -f seed/development.sql

      - name: Run tests
        run: go test ./... -v