services:
  postgres:
    image: postgres:17
    container_name: clearmytravel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: clearmytravel
      POSTGRES_PASSWORD: clearmytravel
      POSTGRES_DB: clearmytravel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: